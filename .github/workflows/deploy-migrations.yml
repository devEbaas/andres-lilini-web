name: Desplegar migraciones

# El esquema se despliega al empujar a main. La CLI es la única fuente de
# verdad: nunca se toca la base remota a mano, porque eso desincroniza
# supabase_migrations.schema_migrations y a partir de ahí `db push` falla.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-migrations.yml"
  workflow_dispatch:

# Dos despliegues a la vez sobre la misma base se pisan: las migraciones se
# aplican en orden y comparten la tabla de historial.
concurrency:
  group: supabase-produccion
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      # Misma versión que la fijada en package.json, para que lo que corre en
      # CI sea lo mismo que corre en local.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Enlazar el proyecto
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Listar lo que se va a aplicar
        run: supabase db push --dry-run

      - name: Aplicar migraciones
        run: supabase db push
