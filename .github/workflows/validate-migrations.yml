name: Validar migraciones

# Levanta una base limpia y aplica todas las migraciones desde cero. Sirve para
# que un SQL inválido no llegue a main: es el check que se puede exigir desde
# Settings › Rules › Rulesets, sin necesitar el plan Pro.
on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/validate-migrations.yml"
      # El catálogo semilla espeja la migración: si cambia uno sin el otro,
      # este workflow es el que lo caza.
      - "src/lib/content/tienda.ts"
      - "scripts/check-catalogo.mjs"
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # El catálogo semilla de la aplicación y el bloque de traducciones de la
      # migración dicen lo mismo a propósito. Se comprueba antes de levantar
      # nada: es barato y falla en segundos.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comprobar que la semilla y la migración no se separaron
        run: node scripts/check-catalogo.mjs

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      # `db start` aplica en orden todo lo que haya en supabase/migrations
      # sobre una base recién creada; si algo falla, falla aquí.
      - name: Aplicar las migraciones sobre una base limpia
        run: supabase db start

      - name: Comprobar que el historial quedó completo
        run: supabase migration list --local
